name: Deploy staging

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: cloudflare-staging
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy staging
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    environment:
      name: staging
      url: ${{ vars.STAGING_URL }}
    env:
      CLOUDFLARE_WORKER_STAGING: ${{ vars.CLOUDFLARE_WORKER_STAGING }}
      CLOUDFLARE_WORKER_PRODUCTION: ${{ vars.CLOUDFLARE_WORKER_PRODUCTION }}
      CLOUDFLARE_WORKERS_SUBDOMAIN: ${{ vars.CLOUDFLARE_WORKERS_SUBDOMAIN }}
      STAGING_URL: ${{ vars.STAGING_URL }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.18.0'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.6
      - name: Confirm separate Workers and fixed staging URL
        run: node --input-type=module -e 'import { getStagingTarget } from "./scripts/staging-target.mjs"; getStagingTarget();'
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint:docs
      - run: bun run test
      - run: bun run check:staging
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
      - name: Publish verified static files
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          : "${CLOUDFLARE_API_TOKEN:?Set the staging Environment secret}"
          : "${CLOUDFLARE_ACCOUNT_ID:?Set the staging Environment secret}"
          bun run deploy:staging
      - name: Verify deployed site and build commit
        shell: bash
        run: |
          curl -fsS -D "$RUNNER_TEMP/staging-headers" -o "$RUNNER_TEMP/staging-page" "$STAGING_URL"
          rg -qi '^x-robots-tag:.*noindex' "$RUNNER_TEMP/staging-headers"
          rg -q '<main' "$RUNNER_TEMP/staging-page"
          curl -fsS "$STAGING_URL/deployment.json" |
            node -e 'const p=JSON.parse(require("fs").readFileSync(0,"utf8")); if(p.commit!==process.env.GITHUB_SHA)process.exit(1)'
